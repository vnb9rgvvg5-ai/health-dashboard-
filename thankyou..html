<!DOCTYPE html>
<html lang="th">
<head>

  <link rel="stylesheet" href="style.css">

  <style>
    /* ส่วนเฉพาะหน้าขอบคุณ (ใช้ token จาก style.css) */
    .thanks {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 4.5rem);
      min-height: calc(100svh - 4.5rem);
      text-align: center;
    }
    .thanks h1 { font-size: var(--fs-xl); margin-bottom: 0; }
    .thanks .rule { margin: var(--sp-3) auto var(--sp-4); }
    .thanks p { margin-inline: auto; }
    .thanks .btn { margin-top: var(--sp-3); }

    @media (max-width: 30rem) {
      .thanks { min-height: calc(100svh - 6.5rem); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">

    </div>

  <footer class="site-footer">
    <div class="container">
      <a href="index.html" class="logo">LANUVA</a>
